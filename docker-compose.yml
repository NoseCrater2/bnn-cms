services:
  mysql-write:
    image: mysql:8.4
    container_name: mysql-write
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

    volumes:
      - mysql_write_data:/var/lib/mysql
      - ./docker/mysql/write-init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - laravel-network


  mysql-read:
    image: mysql:8.4
    container_name: mysql-read
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root

    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

    volumes:
      - mysql_read_data:/var/lib/mysql

    depends_on:
      mysql-write:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - laravel-network


  mysql-replica-init:
    image: mysql:8.4
    container_name: mysql-replica-init
    restart: "no"

    depends_on:
      mysql-write:
        condition: service_healthy

      mysql-read:
        condition: service_healthy

    volumes:
      - ./docker/mysql/init-replica.sh:/init-replica.sh

    entrypoint:
      - /bin/sh
      - /init-replica.sh

    networks:
      - laravel-network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: bnn-app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    depends_on:
      mysql-write:
        condition: service_healthy

      mysql-read:
        condition: service_healthy

      mysql-replica-init:
        condition: service_completed_successfully

    networks:
      - laravel-network

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel-network

  node:
    image: node:22-alpine

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

    ports:
      - "5173:5173"

    command: sh -c "npm install && npm run build"
    profiles:
      - frontend

networks:
  laravel-network:


volumes:
  mysql_write_data:
  mysql_read_data:
  node_modules:
